[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veilkit"
version = "1.0.0"
description = "Zero-dependency, local-first multi-carrier steganography toolkit (PNG/BMP/WAV/zero-width text) with ChaCha20 encryption"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "gitstq" }]
keywords = [
    "steganography", "lsb", "zero-width", "privacy", "chacha20",
    "image-steganography", "audio-steganography", "offline", "security",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
veilkit = "veilkit.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/veilkit"
Repository = "https://github.com/gitstq/veilkit"
Issues = "https://github.com/gitstq/veilkit/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
